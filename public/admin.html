<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07090e" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('3bot-theme');
        var theme = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f6f4' : '#07090e');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="لوحة إدارة مدونة 3bot." />
  <title>لوحة الإدارة · مدونة 3bot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='14' fill='%23071410' stroke='%232ef2c5' stroke-width='2'/%3E%3Ctext x='24' y='33' text-anchor='middle' font-size='24' font-weight='700' fill='%232ef2c5' font-family='Arial,sans-serif'%3E3%3C/text%3E%3Ccircle cx='37' cy='11' r='3' fill='%23e8c074'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin.css" />
  <script src="/theme.js" defer></script>
  <script src="/admin.js" defer></script>
</head>
<body class="admin-body">
  <div class="page-bg" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="العودة إلى المدونة">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="2.5" y="2.5" width="43" height="43" rx="14" fill="var(--mark-bg)" stroke="var(--accent)" stroke-width="1.75"/>
        <circle cx="37" cy="11" r="3" fill="var(--amber)"/>
        <path d="M18.2 14.8c3.3-1.7 8.6-1.4 10.2 2.2 1 2.2.3 4.4-1.7 5.7 2.6 1.1 4 3.6 3.2 6.3-1.2 4-6.6 5.3-11.2 3.6" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M22.4 22.6h6.2" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="brand-text">مدونة <span>3bot</span></span>
    </a>
    <div class="admin-top-actions">
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="التبديل إلى الوضع الفاتح" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 14.3A8.5 8.5 0 1 1 9.7 3 7 7 0 0 0 21 14.3z"/>
        </svg>
      </button>
      <span class="public-pill admin-pill" id="adminPill"><span></span> لوحة الإدارة</span>
      <a class="button button-small button-outline" id="writePostButton" href="/#composer" hidden>اكتب منشورًا</a>
      <button class="button button-small button-outline" id="logoutButton" type="button" hidden>تسجيل الخروج</button>
    </div>
  </header>

  <main class="admin-main" id="adminMain">
    <p class="loading-state" id="bootState">جارٍ تحميل لوحة الإدارة...</p>
  </main>

  <div class="modal-backdrop" id="confirmModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
      <h2 id="confirmTitle">تأكيد الحذف</h2>
      <p id="confirmText">هل تريد حذف هذا المنشور نهائيًا؟ لا يمكن التراجع عن هذا الإجراء.</p>
      <div class="modal-actions">
        <button class="button button-outline" id="cancelDelete" type="button">إلغاء</button>
        <button class="button button-danger" id="confirmDelete" type="button">حذف المنشور</button>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite" aria-relevant="additions"></div>

  <footer>
    <div class="footer-brand" aria-hidden="true">
      <svg class="brand-mark brand-mark-sm" viewBox="0 0 48 48">
        <rect x="2.5" y="2.5" width="43" height="43" rx="14" fill="var(--mark-bg)" stroke="var(--accent)" stroke-width="1.75"/>
        <circle cx="37" cy="11" r="3" fill="var(--amber)"/>
        <path d="M18.2 14.8c3.3-1.7 8.6-1.4 10.2 2.2 1 2.2.3 4.4-1.7 5.7 2.6 1.1 4 3.6 3.2 6.3-1.2 4-6.6 5.3-11.2 3.6" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M22.4 22.6h6.2" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span>مدونة 3bot</span>
    </div>
    <p>© 2026 مدونة 3bot. جميع الحقوق محفوظة.</p>
  </footer>
</body>
</html>
